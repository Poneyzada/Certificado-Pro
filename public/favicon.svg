<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- BJJ Belt (Faixa Preta com Ponteira Vermelha e Graus) -->
  <g transform="translate(6, 14)">
    <!-- Belt Left Fold -->
    <path d="M 6 12 Q 26 2 46 12" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <path d="M 6 12 Q 26 2 46 12" fill="none" stroke="#27272a" stroke-width="6" stroke-linecap="round"/>

    <!-- Belt Tails hanging down -->
    <!-- Left Tail (Belt black body) -->
    <path d="M 22 18 L 16 34" fill="none" stroke="#18181b" stroke-width="7" stroke-linecap="square"/>
    
    <!-- Right Tail (Belt with Red Bar and Stripes) -->
    <path d="M 30 18 L 36 34" fill="none" stroke="#18181b" stroke-width="7" stroke-linecap="square"/>
    <!-- Red Bar (Ponteira Vermelha da Faixa Preta) -->
    <path d="M 33 26 L 36 34" fill="none" stroke="url(#redBar)" stroke-width="7" stroke-linecap="square"/>
    <!-- White Degree Stripes (Graus brancos) -->
    <line x1="33" y1="28" x2="37" y2="28" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="34" y1="31" x2="38" y2="31" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Belt Knot (Nó da Faixa) in Center -->
    <rect x="20" y="12" width="12" height="10" rx="3" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <!-- Knot fold highlight -->
    <line x1="26" y1="13" x2="26" y2="21" stroke="#52525b" stroke-width="1"/>
  </g>

  <!-- Gold Star / Seal Accent in top-right -->
  <circle cx="50" cy="14" r="3.5" fill="url(#gold)"/>
</svg>